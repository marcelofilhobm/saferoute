# Testa e publica o app no GitHub Pages a cada push na main.
# Resultado: https://<usuario>.github.io/<repositorio>/
name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do núcleo
        run: node --test test/core.test.mjs

  publicar:
    needs: testar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site (só os arquivos do app)
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js vendor fonts icons _site/
          # Versão do cache do service worker = commit, para o app atualizar sozinho.
          sed -i "s/contorno-v1/contorno-${GITHUB_SHA::8}/" _site/sw.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
