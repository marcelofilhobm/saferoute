<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a6b5c">
  <meta name="description" content="Verifica se a sua rota atravessa áreas que você evita, e mostra um caminho por fora.">
  <title>Contorno</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topo">
    <div class="marca">
      <span class="selo-app" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20c4-1 5-6 9-7s6-4 7-9"/></svg>
      </span>
      <span class="nome-app">Contorno</span>
    </div>
    <button class="btn-topo" id="abrir-areas" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
      <span>Minhas áreas</span>
      <span class="contador" id="contador-areas">0</span>
    </button>
  </header>

  <main class="palco">
    <div id="mapa" aria-label="Mapa"></div>

    <button class="fab" id="nova-area" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Área</span>
    </button>

    <section class="folha" id="folha" aria-live="polite"></section>
  </main>

  <div class="painel" id="painel-areas" hidden role="dialog" aria-modal="true" aria-labelledby="titulo-areas">
    <div class="painel-topo">
      <h2 id="titulo-areas">Minhas áreas</h2>
      <button class="btn-fechar" id="fechar-areas" type="button" aria-label="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="painel-corpo" id="lista-areas"></div>
    <div class="painel-acoes">
      <label class="btn btn-sec" for="arquivo-importar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>
        Importar arquivo
      </label>
      <input type="file" id="arquivo-importar" accept=".geojson,.json,application/geo+json,application/json" hidden>
      <button class="btn btn-sec" id="exportar-areas" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M4 21h16"/></svg>
        Compartilhar áreas
      </button>
    </div>
    <p class="rodape-privacidade">
      Suas áreas ficam só neste aparelho. Para calcular uma rota, o app envia origem, destino e o contorno das áreas do caminho — sem nome — ao serviço de rotas Valhalla (openstreetmap.de). Mapa © OpenStreetMap, OpenFreeMap.
    </p>
  </div>

  <div class="aviso-flutuante" id="toast" role="status" hidden></div>

  <script src="vendor/maplibre-gl.js"></script>
  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
